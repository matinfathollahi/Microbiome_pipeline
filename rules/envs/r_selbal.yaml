name: r_selbal

channels:
  - conda-forge
  - bioconda

dependencies:
  - r-base=4.5.2

  # Selbal CRAN dependencies
  - r-compositions
  - r-doparallel
  - r-foreach
  - r-ggplot2
  - r-gridextra
  - r-gtable
  - r-plyr
  - r-proc
  - r-qdapregex
  - r-zcompositions

  # Selbal Bioconductor dependencies
  - bioconductor-cma
  - bioconductor-phyloseq